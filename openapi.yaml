openapi: 3.1.0
info:
  title: ZapaKid API
  version: 1.0.0
  summary: Backend for ZapaKid, an end-to-end encrypted chat for families.
  description: |
    The apps encrypt and decrypt with [libsignal](https://github.com/signalapp/libsignal). This API only stores
    public keys, ciphertext and the metadata it needs to route messages. It can never decrypt a chat, and it has no
    cryptography of its own beyond verifying Apple and Google sign-in tokens and hashing session tokens.

    **Stability.** Endpoints tagged `Health`, `Sign-in`, `Account`, `Families`, `Kid pairing` and `Connections` are stable: the apps build against them and
    they only change in a backward-compatible way. Every endpoint tagged `Draft: ...` (and marked `x-status: draft`)
    is a plan, not implemented yet, and will change.

    **Transport.** HTTPS only, TLS 1.3 only, HSTS. No cookies and no CORS: the API is for the ZapaKid apps, not for
    browsers.

    **Data location.** All data stays in the EU (Cloudflare D1 and R2 with EU jurisdiction).

    **Errors** are JSON `{"error": {"code": "...", "message": "..."}}`. Apps branch on `code`; `message` is for logs
    and may change.

    **Sessions.** Sign-in returns an opaque session token. Send it as `Authorization: Bearer <token>`. The server
    stores only its SHA-256 hash. A session expires at `expiresAt`; sign in again after that.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
  contact:
    name: ZapaCIT SRL
    url: https://github.com/ZapaCIT-S-R-L/zapakid-api
servers:
  - url: https://api-staging.zapakid.ro
    description: Staging
  - url: https://api.zapakid.ro
    description: Production (after the v1 cutover; today it still serves the old v0.1 API)

tags:
  - name: Health
    description: Liveness, for monitoring and the post-deploy checks.
  - name: Sign-in
    description: |
      Parents sign in with Apple or Google. Parents must be adults (18+).

      **Flow.** 1) `POST /v1/auth/nonce` → `nonce`. 2) Start Sign in with Apple / Google with the lowercase hex
      SHA-256 of `nonce` as the provider nonce (Apple: `ASAuthorizationAppleIDRequest.nonce`; Android Credential
      Manager: `GetGoogleIdOption.Builder().setNonce(...)` / `GetSignInWithGoogleOption`; Google Sign-In on iOS:
      the `nonce` parameter). 3) `POST /v1/auth/apple` or `/v1/auth/google` with the token, the age range and the
      raw `nonce`. Each nonce works once, for 10 minutes; a replayed token is rejected (`401 invalid_nonce`).

      **App attestation** (`ZapaKid-Attestation` header). Only genuine ZapaKid apps on genuine devices may sign
      in. Android: a *standard* Play Integrity token (`StandardIntegrityManager`, cloud project of the app) whose
      `requestHash` is the lowercase hex SHA-256 of the exact request body bytes, on `POST /v1/auth/google` and
      `POST /v1/auth/apple/exchange`. The server decodes it with Google (`decodeIntegrityToken`) and requires:
      package `ro.zapakid.app` (request and app), the request hash, a timestamp under 10 minutes old,
      `appRecognitionVerdict = PLAY_RECOGNIZED`, ZapaKid's signing certificate, `MEETS_DEVICE_INTEGRITY` and
      `appLicensingVerdict = LICENSED`.
      iOS (bundle `ro.zapakid.app`, team `9572LYGZ7S`): `v1 keyId=<key id, base64> assertion=<base64>`, the
      assertion from `generateAssertion(keyId, clientDataHash: SHA-256(exact body bytes))` with a key registered via
      `POST /v1/attestation/apple`, on `POST /v1/auth/apple` and `POST /v1/auth/google`. The server checks the
      signature against the registered key, the RP ID hash of `9572LYGZ7S.ro.zapakid.app`, and that the counter
      went up (no replay). An unknown key or failed check → `403 attestation_failed`: register a new key.
      Simulators can't attest: on staging they sign in only as allowlisted test accounts.
      Policy per environment: `required` (production) rejects a missing or failing attestation with
      `403 attestation_failed`; `allowlist` (staging) lets a missing header through only for allowlisted test
      accounts, checked after their token verifies; `optional` is for local development only. A header, when
      present, is always checked in full. The body hash includes the one-time nonce, so a token can't be replayed.
  - name: Account
    description: The signed-in parent's own account.
  - name: App attestation
    description: |
      iOS registers an Apple App Attest key once (`/v1/attestation/challenge`, `/v1/attestation/apple`), then signs
      each sign-in with an assertion in the `ZapaKid-Attestation` header (see `Sign-in`). Android needs no
      registration (Play Integrity). Required on sign-in from launch (decided 2026-10-26).
  - name: Families
    description: |
      A family has one or more parents and the kids they add. A parent belongs to one family (v1). Only members see
      a family; to anyone else it doesn't exist (`404`).
  - name: Kid pairing
    description: |
      A parent pairs a kid's phone by showing a QR code. Kids never sign in with Apple or Google. A kid session
      (`zkk_` token) comes only from a parent's pairing code.
  - name: Membership events
    description: |
      Not an HTTP endpoint: the contract between this API (producer) and the chat and calls services (consumers).
      Changes to families (and later connections, devices and account deletion) are sent as `MembershipEvent`
      messages (schema below, identical to `services/chat/openapi.yaml`) to the Cloudflare Queue
      `zapakid-membership-<environment>`, bound here as `MEMBERSHIP_EVENTS`.

      - **Sent today.** `family.member_added`: a family is created (its first parent), a parent joins with an
        invitation, or a kid is added. `family.member_removed`: a parent leaves an empty family to join another one
        (the empty family is deleted). `connection.created`, `connection.removed`, `connection.kid_shared` and
        `connection.kid_unshared` for connections.
      - **Delivery.** At least once; dedupe by `id`. Events are written in the same D1 transaction as the change (a
        transactional outbox), so an event exists exactly when the change happened. They are sent right after the
        change in outbox order, and again by the cron if the queue was unavailable. Without the queue binding they
        wait in the outbox.
      - **Privacy.** Ids only: no names, nicknames, avatars or keys.
  - name: Connections
    description: |
      Parents of different families connect with a one-time code (QR or link), then each family shares chosen kids,
      one by one. The other family sees a shared kid's nickname and avatar only. Any parent of either family can
      unshare their own kids or remove the connection. Parents only.
  - name: "Draft: Connections"
    description: Planned. Email invitations, exact search by phone or email, and blocks.
  - name: "Draft: Devices and keys"
    description: |
      Planned. The key directory for libsignal (X3DH/PQXDH). Each account has one identity key, shared by its
      devices through the phone keychain. Each device has a registration id, a signed EC prekey, a signed Kyber
      last-resort prekey and batches of one-time EC and Kyber prekeys. The server stores only public keys and the
      signatures libsignal made over them; it never sees a private key.

      **Key verification (never silent).** An identity key changes only when the account itself uploads a new one.
      The server then records the change, tells every peer (an `identity_changed` event in their message stream)
      and serves the change history. Apps compute safety numbers with libsignal's fingerprint API from both identity
      keys, let users compare them in person (QR scan), and show a key-change warning before sending to a changed
      identity. Apps must also check the key themselves (libsignal `IdentityKeyStore`): the server's announcement
      helps, but the guarantee is that the app never trusts a new key silently, even if the server lies.
  - name: "Draft: Messages"
    description: |
      Planned. Sealed envelopes per recipient device: 1:1 messages are libsignal `PreKeySignalMessage` or
      `SignalMessage`; group messages are `SenderKeyMessage`, and sender keys travel as pairwise-encrypted
      `SenderKeyDistributionMessage`. The server sees ciphertext, sender, recipient and time, nothing else.
      Every chat that includes a kid includes the parents of all families in it; the server enforces that list.
  - name: "Draft: Attachments"
    description: |
      Planned. Photos and voice messages are encrypted on the phone (keys and digest travel inside the encrypted
      message) and uploaded as opaque blobs to R2 (EU).

security:
  - session: []

paths:
  /health:
    get:
      tags: [Health]
      operationId: health
      summary: Is the API up?
      security: []
      responses:
        "200":
          description: Up.
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: { const: ok }
                  version:
                    type: string
                    description: The deployed release tag (vMAJOR.MINOR.PATCH), `dev` locally.
                    examples: [v1.0.3]
        "503":
          description: |
            The Worker runs but its configuration is incomplete (a binding or variable missing or invalid, or the
            database unreachable). `problems` names what is wrong, never a value.
          content:
            application/json:
              schema:
                type: object
                required: [status, version, problems]
                properties:
                  status: { const: misconfigured }
                  version: { type: string }
                  problems:
                    type: array
                    items: { type: string }
                    examples: [["APPLE_AUDIENCES empty"]]

  /v1/auth/nonce:
    post:
      tags: [Sign-in]
      operationId: createSignInNonce
      summary: A one-time nonce for the next sign-in.
      description: |
        Random (32 bytes, base64url), single use, valid for 10 minutes. The server stores only a hash of it. Pass
        the lowercase hex SHA-256 of `nonce` to Apple or Google as the sign-in nonce; their token then carries it
        in its `nonce` claim, and the server checks it against the `nonce` you send with the token.
      security: []
      responses:
        "200":
          description: The nonce.
          content:
            application/json:
              schema:
                type: object
                required: [nonce, expiresAt]
                properties:
                  nonce: { $ref: "#/components/schemas/Nonce" }
                  expiresAt: { type: string, format: date-time }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/auth/apple:
    post:
      tags: [Sign-in]
      operationId: signInWithApple
      summary: Sign in a parent with Sign in with Apple.
      description: |
        Send the `identityToken` from Sign in with Apple (`ASAuthorizationAppleIDCredential.identityToken`) and the
        age range from Apple's Declared Age Range. The server verifies the token against Apple's keys
        (`https://appleid.apple.com/auth/keys`): signature (RS256), issuer `https://appleid.apple.com`, audience
        (the iOS bundle id, or the Apple Services ID for the web flow on Android), expiry. The first sign-in creates the parent's account. Each sign-in starts a new
        session.
      parameters: [{ $ref: "#/components/parameters/attestation" }]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppleSignInRequest" }
      responses:
        "200": { $ref: "#/components/responses/SignedIn" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/InvalidTokenOrNonce" }
        "403": { $ref: "#/components/responses/AgeNotAllowed" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503": { $ref: "#/components/responses/ProviderUnavailable" }

  /v1/auth/apple/web:
    post:
      tags: [Sign-in]
      operationId: startAppleWebSignIn
      summary: Start Sign in with Apple in the browser (Android).
      description: |
        Android has no native Sign in with Apple, so the app uses Apple's web flow:

        1. `POST /v1/auth/nonce` → `nonce`. Create a PKCE `codeVerifier` (43-128 characters, RFC 7636) and
           `codeChallenge` = base64url(SHA-256(codeVerifier)).
        2. `POST /v1/auth/apple/web` with `codeChallenge` → `state`.
        3. Open (Custom Tab) `https://appleid.apple.com/auth/authorize` with `client_id` = ZapaKid's Apple
           Services ID, `redirect_uri` = `<API origin>/v1/auth/apple/callback`, `response_type=code id_token`,
           `response_mode=form_post`, `scope=name email`, `state`, and `nonce` = lowercase hex SHA-256 of `nonce`.
        4. Apple posts to `POST /v1/auth/apple/callback`; the API verifies Apple's token and redirects the browser
           to `https://zapakid.ro/app/apple#code=...&state=...` (an Android App Link that opens the app), or
           `#error=...&state=...`.
        5. The app checks `state`, then `POST /v1/auth/apple/exchange` with `code`, `codeVerifier`, `nonce` and the
           age range → session, as for the other sign-ins.

        No Apple token ever reaches the app or the URL. The flow expires after 10 minutes; the code after 2.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codeChallenge, codeChallengeMethod]
              additionalProperties: false
              properties:
                codeChallenge: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
                codeChallengeMethod: { const: S256 }
      responses:
        "200":
          description: The flow's `state`, to pass to Apple.
          content:
            application/json:
              schema:
                type: object
                required: [state, expiresAt]
                properties:
                  state: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
                  expiresAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/auth/apple/callback:
    post:
      tags: [Sign-in]
      operationId: appleWebCallback
      summary: Apple's form_post redirect target (called by the browser, not by the app).
      description: |
        Receives `state`, `id_token`, `code`, `user` (first sign-in only: the name) or `error` from Apple. The
        server verifies the identity token like `POST /v1/auth/apple` (audience = the Services ID), keeps only
        the verified identity for the flow, and answers `303` to the app link. The `code` in the fragment is the
        API's own one-time code, not Apple's.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                state: { type: string }
                id_token: { type: string }
                code: { type: string }
                user: { type: string, description: "JSON with the user's name, first sign-in only." }
                error: { type: string }
      responses:
        "303":
          description: |
            `Location: https://zapakid.ro/app/apple#code=<code>&state=<state>`, or `#error=<error>&state=<state>`
            with `error` one of `invalid_state` (unknown, expired or already used flow), `invalid_token`,
            `provider_unavailable`, or Apple's own error (for example `user_cancelled_authorize`).
          headers:
            Location: { schema: { type: string } }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/auth/apple/exchange:
    post:
      tags: [Sign-in]
      operationId: exchangeAppleWebCode
      summary: Finish the web flow - the app trades the one-time code for a session.
      description: |
        Checks the code (once, within 2 minutes), PKCE (`base64url(SHA-256(codeVerifier))` = the flow's
        `codeChallenge`), and the nonce rules of `POST /v1/auth/apple` (Apple's token carried SHA-256 of `nonce`;
        the nonce is used up). Then the age range, exactly as for the other sign-ins.
      parameters: [{ $ref: "#/components/parameters/attestation" }]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, codeVerifier, nonce, ageRange]
              additionalProperties: false
              properties:
                code: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
                codeVerifier: { type: string, pattern: "^[A-Za-z0-9._~-]{43,128}$" }
                nonce: { $ref: "#/components/schemas/Nonce" }
                ageRange: { $ref: "#/components/schemas/AgeRange" }
      responses:
        "200": { $ref: "#/components/responses/SignedIn" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401":
          description: |
            `invalid_code`: unknown, expired or already used code, or the PKCE verifier doesn't match.
            `invalid_nonce`: as for `POST /v1/auth/apple`. Start the flow again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/AgeNotAllowed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ProviderUnavailable" }

  /v1/auth/google:
    post:
      tags: [Sign-in]
      operationId: signInWithGoogle
      summary: Sign in a parent with Google.
      description: |
        Send the Google ID token (Credential Manager `GoogleIdTokenCredential.idToken`, or Google Sign-In on iOS)
        and the age range from Google Play Age Signals. The server verifies the token against Google's keys
        (`https://www.googleapis.com/oauth2/v3/certs`): signature (RS256), issuer `https://accounts.google.com`,
        audience (one of ZapaKid's OAuth client ids), expiry. The email is stored only when Google says it is
        verified.
      parameters: [{ $ref: "#/components/parameters/attestation" }]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoogleSignInRequest" }
      responses:
        "200": { $ref: "#/components/responses/SignedIn" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/InvalidTokenOrNonce" }
        "403": { $ref: "#/components/responses/AgeNotAllowed" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503": { $ref: "#/components/responses/ProviderUnavailable" }

  /v1/auth/logout:
    post:
      tags: [Sign-in]
      operationId: logout
      summary: End this session.
      description: Deletes the session the token belongs to. Other sessions of the same parent stay valid.
      responses:
        "204": { description: "Signed out. The token no longer works." }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/me:
    get:
      tags: [Account]
      operationId: getMe
      summary: The signed-in parent.
      responses:
        "200":
          description: The parent's profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Parent" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/attestation/challenge:
    post:
      tags: [App attestation]
      operationId: createAttestationChallenge
      summary: A one-time challenge for registering an App Attest key (iOS).
      description: Random (32 bytes, base64url), single use, valid for 5 minutes. No session needed.
      security: []
      responses:
        "200":
          description: The challenge.
          content:
            application/json:
              schema:
                type: object
                required: [challenge, expiresAt]
                properties:
                  challenge: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
                  expiresAt: { type: string, format: date-time }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/attestation/apple:
    post:
      tags: [App attestation]
      operationId: registerAppAttestKey
      summary: Register this iPhone's App Attest key.
      description: |
        `attestKey(keyId, clientDataHash: SHA-256(UTF-8 of challenge))`, then send the result here. The server
        verifies it as Apple documents ("Validating apps that connect to your server"): the certificate chain to
        Apple's App Attestation Root CA, the nonce (SHA-256(authData ‖ clientDataHash)) in the leaf certificate,
        `keyId` = SHA-256 of the leaf's public key, the RP ID hash of App ID `9572LYGZ7S.ro.zapakid.app`, counter 0,
        the credential id, and the environment (`appattestdevelop` is accepted on staging only). The challenge is
        used up either way. It stores the public key and counter, nothing about the user. A key unused for 180 days
        is deleted; the next sign-in then gets `403 attestation_failed` and the app registers a new key.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keyId, attestationObject, challenge]
              additionalProperties: false
              properties:
                keyId:
                  type: string
                  pattern: "^[A-Za-z0-9+/]{43}=$"
                  description: The key id from `DCAppAttestService.generateKey()` (base64).
                attestationObject:
                  allOf: [{ $ref: "#/components/schemas/Base64" }]
                  description: From `attestKey`, base64.
                challenge: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
      responses:
        "204": { description: "Registered." }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "403": { $ref: "#/components/responses/AttestationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/families:
    post:
      tags: [Families]
      operationId: createFamily
      summary: The caller's family; created on first call.
      description: |
        The app calls this right after every sign-in, unless the parent is joining a family with an invitation code.
        The first call creates the family with the caller as its first parent (`201`). Later calls return the
        existing family (`200`) and ignore `name`. A parent belongs to one family.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: [string, "null"]
                  minLength: 1
                  maxLength: 60
                  description: Shown to the family's members only. Trimmed; one line.
      responses:
        "200":
          description: The caller already had a family. Nothing changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Family" }
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Family" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      tags: [Families]
      operationId: listFamilies
      summary: The families the caller belongs to (none or one in v1).
      description: Parents and kids. A kid session gets the kid's own family.
      responses:
        "200":
          description: Families with their parents and kids.
          content:
            application/json:
              schema:
                type: object
                required: [families]
                properties:
                  families: { type: array, maxItems: 1, items: { $ref: "#/components/schemas/Family" } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/families/{familyId}/parents/invitations:
    post:
      tags: [Families]
      operationId: inviteCoParent
      summary: A one-time code that lets another parent join the family.
      description: |
        Show it as a QR code or share it as a link (`https://zapakid.ro/join#<code>`; the fragment never reaches a
        server log). Valid for 72 hours, single use. At most 5 open invitations per family. Only the SHA-256 of the
        code is stored. Invitations by email come later. A non-member gets `404`.
      parameters: [{ $ref: "#/components/parameters/familyId" }]
      responses:
        "201":
          description: Invitation created.
          content:
            application/json:
              schema:
                type: object
                required: [code, expiresAt]
                properties:
                  code: { $ref: "#/components/schemas/InvitationCode" }
                  expiresAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429":
          description: "`too_many_invitations`: 5 invitations are still open. Wait until one is used or expires."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/families/join:
    post:
      tags: [Families]
      operationId: joinFamily
      summary: Join a family with an invitation code (the second parent).
      description: |
        Uses up the code. A parent who is alone in a family without kids (for example, one who already called
        `POST /v1/families`) moves over, and the empty family is deleted. A parent whose family has kids or another
        parent gets `409 already_in_family`, and the code stays unused. Repeating the call (already a member) returns
        the family again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              additionalProperties: false
              properties:
                code: { $ref: "#/components/schemas/InvitationCode" }
      responses:
        "200":
          description: Joined; the family.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Family" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: "`already_in_family`: the caller's own family has kids or another parent."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: "`invitation_invalid`: the code is unknown, expired or already used. Ask for a new one."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/families/{familyId}/kids:
    post:
      tags: [Families]
      operationId: addKid
      summary: Add a kid (nickname, avatar, grade; nothing else).
      description: |
        Any parent of the family may add kids, at most 12 per family. A kid has no real name, birthday or photo on
        the server. Pair the kid's phone afterwards. A non-member gets `404`.
      parameters: [{ $ref: "#/components/parameters/familyId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname, avatar]
              additionalProperties: false
              properties:
                nickname: { type: string, minLength: 1, maxLength: 40, description: Trimmed; one line. }
                avatar: { $ref: "#/components/schemas/Avatar" }
                grade: { $ref: "#/components/schemas/Grade" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Kid" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`too_many_kids`: the family already has 12 kids."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/families/{familyId}/kids/{kidId}/pairing:
    post:
      tags: [Kid pairing]
      operationId: createKidPairing
      summary: A one-time code that pairs a phone with this kid, shown as a QR code.
      description: |
        For a new kid, add the kid first (`POST /v1/families/{familyId}/kids`) and then pair. For an existing kid
        (a new or replaced phone), pair again: the new phone gets its own kid session, and the kid's chats come back
        through a key re-share from a family phone, never from the server.

        The code is valid for 5 minutes and works once. At most 5 codes per family can be open at a time. Only its
        SHA-256 is stored. Any parent of the family may create codes. A non-member, or a kid of another family, gets
        `404`.

        **QR payload** (built by the parent's app): `zapakid://pair?code=<code>&fp=<parent identity key fingerprint,
        hex>`. The kid's phone checks the parent's key against `fp` after pairing, so the key is verified out of band
        and not trusted on first use.
      parameters: [{ $ref: "#/components/parameters/familyId" }, { $ref: "#/components/parameters/kidId" }]
      responses:
        "201":
          description: The code.
          content:
            application/json:
              schema:
                type: object
                required: [code, expiresAt, kid]
                properties:
                  code: { $ref: "#/components/schemas/PairingCode" }
                  expiresAt: { type: string, format: date-time }
                  kid: { $ref: "#/components/schemas/Kid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429":
          description: "`too_many_pairings`: 5 codes are still open. Wait until one is used or expires."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/pairing/redeem:
    post:
      tags: [Kid pairing]
      operationId: redeemKidPairing
      summary: The kid's phone redeems the pairing code and gets a kid session.
      description: |
        No session is needed: the code is the credential. The response is a kid session (`zkk_` token), valid for
        365 days. Store it like a parent session (keychain / Keystore). A kid session can read the kid's family
        (`GET /v1/families`), but it can't do anything that only parents may do (`401`).

        Rate limited per network like sign-in (`AUTH_LIMITER`). App attestation (`ZapaKid-Attestation`, over the
        exact body bytes, as on sign-in) works the same way, with one difference on staging (`allowlist`): a request
        without attestation is accepted only for a code created by an allowlisted test parent. When attestation is
        refused, the code stays usable.
      security: []
      parameters: [{ $ref: "#/components/parameters/attestation" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              additionalProperties: false
              properties:
                code: { $ref: "#/components/schemas/PairingCode" }
      responses:
        "200":
          description: Paired.
          content:
            application/json:
              schema:
                type: object
                required: [session, kid, family]
                properties:
                  session:
                    type: object
                    required: [token, expiresAt]
                    properties:
                      token:
                        type: string
                        pattern: "^zkk_[A-Za-z0-9_-]{43}$"
                        description: "Opaque kid session. Send as `Authorization: Bearer <token>`. Never log it."
                      expiresAt: { type: string, format: date-time }
                  kid: { $ref: "#/components/schemas/Kid" }
                  family:
                    type: object
                    required: [id, name]
                    properties:
                      id: { type: string, format: uuid }
                      name: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "403": { $ref: "#/components/responses/AttestationFailed" }
        "410":
          description: "`pairing_code_invalid`: the code is unknown, expired or already used. Ask a parent for a new QR."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ProviderUnavailable" }

  /v1/connections:
    get:
      tags: [Connections]
      operationId: listConnections
      summary: The caller's family's connections, each with the other family and the shared kids.
      description: |
        `sharedKids.mine`: ids of your kids shared in this connection. `sharedKids.theirs`: the other family's
        kids shared with you, with nickname and avatar only.
      responses:
        "200":
          description: Connections, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [connections]
                properties:
                  connections: { type: array, items: { $ref: "#/components/schemas/Connection" } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/connections/invitations:
    post:
      tags: [Connections]
      operationId: createConnectionInvitation
      summary: A one-time code another family's parent scans or opens to connect the two families.
      description: |
        Show it as a QR code or share it as a link (`https://zapakid.ro/connect#<code>`). It's valid for 72 hours and
        works once. At most 5 can be open per family. Only its SHA-256 is stored. Needs a family
        (`409 no_family`).
      responses:
        "201":
          description: The code.
          content:
            application/json:
              schema:
                type: object
                required: [code, expiresAt]
                properties:
                  code: { $ref: "#/components/schemas/ConnectionCode" }
                  expiresAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: "`no_family`: create your family first."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: "`too_many_invitations`: 5 codes are still open."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/connections/accept:
    post:
      tags: [Connections]
      operationId: acceptConnection
      summary: Connect your family with the family whose code this is.
      description: |
        Scanning the code is the consent of the accepting parent; showing it was the consent of the other family.
        No kids are shared yet: each family shares kids one by one. Emits `connection.created`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              additionalProperties: false
              properties:
                code: { $ref: "#/components/schemas/ConnectionCode" }
      responses:
        "201":
          description: Connected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: |
            `no_family`: create your family first. `own_family`: the code is from your own family.
            `already_connected`: the families are already connected. `too_many_connections`: 50 per family.
            In every case the code stays unused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: "`invitation_invalid`: the code is unknown, expired or already used."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/connections/{connectionId}/shared-kids/{kidId}:
    put:
      tags: [Connections]
      operationId: shareKid
      summary: Share one of your kids with the connected family.
      description: |
        Only your own family's kids (anything else is `404`). Repeating it is a no-op. Emits
        `connection.kid_shared` when the kid wasn't shared yet.
      parameters: [{ $ref: "#/components/parameters/connectionId" }, { $ref: "#/components/parameters/kidId" }]
      responses:
        "204": { description: "Shared." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Connections]
      operationId: unshareKid
      summary: Stop sharing a kid. The chat service closes the kid's chats with that family.
      description: Repeating it is a no-op. Emits `connection.kid_unshared` when the kid was shared.
      parameters: [{ $ref: "#/components/parameters/connectionId" }, { $ref: "#/components/parameters/kidId" }]
      responses:
        "204": { description: "No longer shared." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/connections/{connectionId}:
    delete:
      tags: [Connections]
      operationId: removeConnection
      summary: Disconnect the two families (any parent of either family).
      description: All shared kids go with it. Emits `connection.removed`. A non-member gets `404`.
      parameters: [{ $ref: "#/components/parameters/connectionId" }]
      responses:
        "204": { description: "Disconnected." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------------------------------------------------------
  # Draft endpoints below: planned, not implemented, will change.
  # ---------------------------------------------------------------------------------------------------------------

  /v1/connections/requests:
    post:
      tags: ["Draft: Connections"]
      operationId: requestConnection
      x-status: draft
      summary: Ask another parent to connect (QR, invite link, email invite, or exact phone/email search).
      description: |
        Always answers `202 request sent`, whether or not the person exists (no account enumeration). About 10
        searches a day per parent. Parents can opt out of being found.
      responses:
        "202": { description: "Request sent." }
        "429": { description: "Too many searches today." }
    get:
      tags: ["Draft: Connections"]
      operationId: listConnectionRequests
      x-status: draft
      summary: Incoming and outgoing requests.
      responses:
        "200": { description: "Requests." }

  /v1/connections/requests/{requestId}:
    post:
      tags: ["Draft: Connections"]
      operationId: answerConnectionRequest
      x-status: draft
      summary: Accept or decline (any parent of the family; the others are notified and can undo).
      parameters: [{ name: requestId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "Answered." }

  /v1/blocks:
    post:
      tags: ["Draft: Connections"]
      operationId: block
      x-status: draft
      summary: A parent blocks a person or a whole family.
      responses:
        "204": { description: "Blocked." }

  /v1/devices:
    post:
      tags: ["Draft: Devices and keys"]
      operationId: registerDevice
      x-status: draft
      summary: Register this phone and upload its public keys.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceKeys" }
      responses:
        "201":
          description: The device id (libsignal `ProtocolAddress` device id).
          content:
            application/json:
              schema:
                type: object
                required: [deviceId]
                properties:
                  deviceId: { $ref: "#/components/schemas/DeviceId" }

  /v1/keys/prekeys:
    put:
      tags: ["Draft: Devices and keys"]
      operationId: uploadPreKeys
      x-status: draft
      summary: Top up one-time prekeys, or rotate the signed prekeys.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                signedPreKey: { $ref: "#/components/schemas/SignedPreKey" }
                pqLastResortPreKey: { $ref: "#/components/schemas/SignedPreKey" }
                preKeys: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/PreKey" } }
                pqPreKeys: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/SignedPreKey" } }
      responses:
        "204": { description: "Stored." }
    get:
      tags: ["Draft: Devices and keys"]
      operationId: countPreKeys
      x-status: draft
      summary: How many one-time prekeys this device has left (top up below 20).
      responses:
        "200": { description: "`{ preKeys, pqPreKeys }` counts." }

  /v1/keys/identity:
    put:
      tags: ["Draft: Devices and keys"]
      operationId: changeIdentityKey
      x-status: draft
      summary: Replace the account's identity key (new phone without keychain restore, or reset).
      description: |
        Never silent: the server stores the change in the account's key history, sends `identity_changed` to every
        peer, and peers show a key-change warning and new safety number before the next message. All devices of the
        account must then upload new signed prekeys.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identityKey, signedPreKey, pqLastResortPreKey]
              properties:
                identityKey: { $ref: "#/components/schemas/PublicKey" }
                signedPreKey: { $ref: "#/components/schemas/SignedPreKey" }
                pqLastResortPreKey: { $ref: "#/components/schemas/SignedPreKey" }
      responses:
        "204": { description: "Changed; peers are notified." }

  /v1/accounts/{accountId}/identity:
    get:
      tags: ["Draft: Devices and keys"]
      operationId: getIdentity
      x-status: draft
      summary: An account's current identity key and its change history (for safety numbers and warnings).
      description: Only for accounts the caller may chat with (same family, or a connected family's parent or shared kid).
      parameters: [{ $ref: "#/components/parameters/accountId" }]
      responses:
        "200":
          description: Identity key and history.
          content:
            application/json:
              schema:
                type: object
                required: [identityKey, changes]
                properties:
                  identityKey: { $ref: "#/components/schemas/PublicKey" }
                  changes:
                    type: array
                    items:
                      type: object
                      required: [identityKey, changedAt]
                      properties:
                        identityKey: { $ref: "#/components/schemas/PublicKey" }
                        changedAt: { type: string, format: date-time }

  /v1/keys/{accountId}/{deviceId}:
    get:
      tags: ["Draft: Devices and keys"]
      operationId: getPreKeyBundle
      x-status: draft
      summary: Prekey bundles to start a session (`*` = all devices of the account).
      description: |
        Returns what libsignal's `PreKeyBundle` needs: registration id, device id, identity key, signed EC prekey,
        signed Kyber prekey (one-time if left, else last resort) and one one-time EC prekey if left. Each fetch
        consumes the one-time keys it returns. Only for accounts the caller may chat with; rate limited.
      parameters:
        - { $ref: "#/components/parameters/accountId" }
        - name: deviceId
          in: path
          required: true
          schema: { oneOf: [{ $ref: "#/components/schemas/DeviceId" }, { const: "*" }] }
      responses:
        "200":
          description: One bundle per device.
          content:
            application/json:
              schema:
                type: object
                required: [identityKey, devices]
                properties:
                  identityKey: { $ref: "#/components/schemas/PublicKey" }
                  devices: { type: array, items: { $ref: "#/components/schemas/PreKeyBundle" } }
        "404": { description: "No such account or device, or not allowed." }

  /v1/conversations:
    post:
      tags: ["Draft: Messages"]
      operationId: createConversation
      x-status: draft
      summary: Start a 1:1 or group chat.
      description: The server adds the parents of every family whose kid is in the chat, as readers.
      responses:
        "201": { description: "Conversation id and the full member list." }
    get:
      tags: ["Draft: Messages"]
      operationId: listConversations
      x-status: draft
      summary: The caller's chats (members only; no content).
      responses:
        "200": { description: "Conversations." }

  /v1/messages:
    post:
      tags: ["Draft: Messages"]
      operationId: sendMessage
      x-status: draft
      summary: Send one encrypted envelope per recipient device.
      description: |
        `409` if the device list is stale (missing or extra devices), `410` if a registration id changed; the app
        refreshes keys and retries. Recipients must be members of the conversation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversationId, envelopes]
              properties:
                conversationId: { type: string }
                envelopes: { type: array, maxItems: 256, items: { $ref: "#/components/schemas/OutgoingEnvelope" } }
      responses:
        "202": { description: "Queued for every device." }
        "409": { description: "Stale device list." }
        "410": { description: "Stale registration id." }
    get:
      tags: ["Draft: Messages"]
      operationId: fetchMessages
      x-status: draft
      summary: Queued envelopes for this device (when the live stream is not connected).
      responses:
        "200": { description: "Envelopes, oldest first." }

  /v1/messages/{envelopeId}:
    delete:
      tags: ["Draft: Messages"]
      operationId: ackMessage
      x-status: draft
      summary: Acknowledge an envelope; the server deletes it.
      parameters: [{ name: envelopeId, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: "Deleted from the queue." }

  /v1/stream:
    get:
      tags: ["Draft: Messages"]
      operationId: stream
      x-status: draft
      summary: WebSocket for live envelopes and events (`identity_changed`, membership changes).
      description: One Durable Object per account fans out to its connected devices.
      responses:
        "101": { description: "Switching protocols." }

  /v1/attachments:
    post:
      tags: ["Draft: Attachments"]
      operationId: createAttachment
      x-status: draft
      summary: Reserve an upload for an encrypted photo or voice message.
      responses:
        "201": { description: "`{ attachmentId, uploadUrl, expiresAt }`; max size per type." }

  /v1/attachments/{attachmentId}:
    get:
      tags: ["Draft: Attachments"]
      operationId: downloadAttachment
      x-status: draft
      summary: Download the encrypted blob (conversation members only).
      parameters: [{ name: attachmentId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "The ciphertext." }

# Outbound messages. Not HTTP: OpenAPI 3.1 webhooks are used to describe the queue messages this API produces.
webhooks:
  membershipEvent:
    post:
      tags: [Membership events]
      operationId: membershipEvent
      summary: A message on the MEMBERSHIP_EVENTS Cloudflare Queue (not an HTTP call).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MembershipEvent" }
      responses:
        "200": { description: "Consumers ack the queue message; nothing is returned." }

components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: |
        An opaque session token: a parent's from sign-in (`zks_` + 43 base64url characters) or a kid's from pairing
        (`zkk_` + 43). Endpoints for parents only answer `401` to a kid token.

  parameters:
    attestation:
      name: ZapaKid-Attestation
      in: header
      required: false
      description: |
        App attestation for this request (see `Sign-in`). Android: the standard Play Integrity token, with
        `requestHash` = lowercase hex SHA-256 of the body. iOS: `v1 keyId=<base64> assertion=<base64>` (App
        Attest assertion over SHA-256 of the body). Required where the policy is `required`.
      schema: { type: string, maxLength: 16384 }
    familyId: { name: familyId, in: path, required: true, schema: { type: string } }
    kidId: { name: kidId, in: path, required: true, schema: { type: string } }
    connectionId: { name: connectionId, in: path, required: true, schema: { type: string } }
    accountId: { name: accountId, in: path, required: true, schema: { type: string } }

  responses:
    SignedIn:
      description: Signed in. Store the token in the keychain / Android Keystore-backed storage.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SignInResponse" }
    InvalidRequest:
      description: "`invalid_request`: the body is not valid JSON or misses a field."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidTokenOrNonce:
      description: |
        `invalid_token`: the Apple/Google token is malformed, expired, for another app (audience), from another
        issuer, or its signature does not verify. `invalid_nonce`: the token's `nonce` claim is missing or isn't
        the SHA-256 of the `nonce` sent, or that nonce is unknown, expired or already used (a replay). Either way:
        get a new nonce and sign in with the provider again.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AgeNotAllowed:
      description: |
        `attestation_failed`: no valid app attestation (not the genuine ZapaKid app from Google Play / the App
        Store, or not a genuine device). Nothing is checked or stored after it; the nonce stays usable.

        Only adults (18+) can sign in as parents. Nothing is stored, and the nonce is used up.
        `minor_not_allowed`: the shared age range is under 18, or doesn't show 18+ (for example "16 and up").
        `age_declined`: the user declined to share their age range. The app can ask again and retry.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: "`unauthorized`: no session token, or it is unknown, expired or signed out."
      headers:
        WWW-Authenticate: { schema: { type: string, const: Bearer } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: |
        `rate_limited`: too many nonce and sign-in requests from this network (20 a minute per IPv4 address or
        IPv6 /64, per Cloudflare location). Wait `Retry-After` seconds.
      headers:
        Retry-After: { schema: { type: integer, const: 60 } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: "`not_found`: no such resource, or the caller isn't allowed to see it."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooLarge:
      description: "`payload_too_large`: the body is over 16 KiB."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnsupportedMediaType:
      description: "`unsupported_media_type`: send `Content-Type: application/json`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ProviderUnavailable:
      description: |
        `provider_unavailable`: Apple's or Google's keys could not be fetched. `attestation_unavailable`: Google's
        Play Integrity API could not be reached or isn't configured. Retry later.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AttestationFailed:
      description: "`attestation_failed`: not a genuine ZapaKid app on a genuine device."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              examples: [invalid_token]
            message: { type: string }

    AgeRange:
      type: object
      description: |
        What the platform age API returned, passed through by the app.

        | `availability` | When | Bounds | Server |
        | --- | --- | --- | --- |
        | `shared` | the user shared a range | the range (`null` = open end) | 18+ (`lowerBound` ≥ 18) → adult; anything else → `403 minor_not_allowed` |
        | `declined` | the user declined to share | both `null` | `403 age_declined` |
        | `unavailable` | the API isn't offered (country, OS version, account type) | both `null` | allowed, recorded as `unavailable`; the 18+ declaration in the parental agreement covers it |

        - Apple Declared Age Range: response `.sharing(range)` → `shared` with `range.lowerBound` /
          `range.upperBound`; `.declinedSharing` → `declined`; API not offered (older iOS, region, or the framework reports it unavailable) → `unavailable`.
        - Google Play Age Signals: `VERIFIED` → `shared`, `lowerBound: 18`, `upperBound: null`; `SUPERVISED` and the
          other supervised statuses → `shared` with `ageLower` / `ageUpper`; `UNKNOWN`, or the API not offered (country, or the API reports it unavailable) → `unavailable`. Play has no "declined" outcome.
        - Put the platform's raw status in `platformStatus`.
      required: [availability, source, lowerBound, upperBound]
      additionalProperties: false
      properties:
        availability:
          type: string
          enum: [shared, declined, unavailable]
        source:
          type: string
          enum: [apple_declared_age_range, google_play_age_signals]
        lowerBound: { type: [integer, "null"], minimum: 0, maximum: 150 }
        upperBound: { type: [integer, "null"], minimum: 0, maximum: 150 }
        platformStatus:
          type: string
          maxLength: 40
          pattern: "^[A-Za-z_]+$"
          description: The platform's raw status, recorded as is (for example `VERIFIED`, `SUPERVISED`, `declinedSharing`).

    Nonce:
      type: string
      pattern: "^[A-Za-z0-9_-]{43}$"
      description: From `POST /v1/auth/nonce`. Send the raw value; the provider gets its lowercase hex SHA-256.

    AppleSignInRequest:
      type: object
      required: [identityToken, ageRange, nonce]
      additionalProperties: false
      properties:
        nonce: { $ref: "#/components/schemas/Nonce" }
        identityToken:
          type: string
          maxLength: 8192
          description: The JWT from Sign in with Apple.
        ageRange:
          allOf: [{ $ref: "#/components/schemas/AgeRange" }]
          description: The platform's age API on this phone (Declared Age Range on iOS, Play Age Signals on Android).
        displayName:
          type: string
          maxLength: 100
          description: |
            Apple gives the user's name to the app only on the first sign-in and never in the token. Used only when
            the account is new.

    GoogleSignInRequest:
      type: object
      required: [idToken, ageRange, nonce]
      additionalProperties: false
      properties:
        nonce: { $ref: "#/components/schemas/Nonce" }
        idToken:
          type: string
          maxLength: 8192
          description: The Google ID token (JWT).
        ageRange:
          allOf: [{ $ref: "#/components/schemas/AgeRange" }]
          description: The platform's age API on this phone (Play Age Signals on Android, Declared Age Range on iOS).

    SignInResponse:
      type: object
      required: [session, parent, newAccount]
      properties:
        session:
          type: object
          required: [token, expiresAt]
          properties:
            token:
              type: string
              pattern: "^zks_[A-Za-z0-9_-]{43}$"
              description: "Opaque. Send as `Authorization: Bearer <token>`. Never log it."
            expiresAt: { type: string, format: date-time }
        parent: { $ref: "#/components/schemas/Parent" }
        newAccount:
          type: boolean
          description: True when this sign-in created the account.

    Parent:
      type: object
      required: [id, email, displayName, ageRange, createdAt]
      properties:
        id: { type: string, format: uuid }
        email:
          type: [string, "null"]
          description: From the provider, only if verified. Apple may give a private relay address.
        displayName: { type: [string, "null"] }
        ageRange:
          type: object
          required: [category, source, lowerBound, upperBound, checkedAt]
          description: The latest age range, recorded at sign-in.
          properties:
            category:
              type: string
              enum: [adult, unavailable]
              description: "`adult`: the platform showed 18+. `unavailable`: the platform's age API wasn't offered."
            source: { type: string, enum: [apple_declared_age_range, google_play_age_signals] }
            lowerBound: { type: [integer, "null"] }
            upperBound: { type: [integer, "null"] }
            platformStatus: { type: [string, "null"] }
            checkedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    InvitationCode:
      type: string
      pattern: "^zki_[A-Za-z0-9_-]{43}$"
      description: A one-time family invitation code. Secret until used; never log it.
    ConnectionCode:
      type: string
      pattern: "^zkc_[A-Za-z0-9_-]{43}$"
      description: A one-time code that connects two families (72 hours). Secret until used; never log it.
    Connection:
      type: object
      required: [id, createdAt, family, sharedKids]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        family:
          type: object
          description: The other family.
          required: [id, name, parents]
          properties:
            id: { type: string, format: uuid }
            name: { type: [string, "null"] }
            parents:
              type: array
              items:
                type: object
                required: [id, displayName]
                properties:
                  id: { type: string, format: uuid }
                  displayName: { type: [string, "null"] }
        sharedKids:
          type: object
          required: [mine, theirs]
          properties:
            mine:
              type: array
              description: Ids of your kids shared in this connection.
              items: { type: string, format: uuid }
            theirs:
              type: array
              description: The other family's kids shared with you.
              items:
                type: object
                required: [id, nickname, avatar]
                properties:
                  id: { type: string, format: uuid }
                  nickname: { type: string }
                  avatar: { $ref: "#/components/schemas/Avatar" }
    PairingCode:
      type: string
      pattern: "^zkp_[A-Za-z0-9_-]{43}$"
      description: A one-time kid pairing code (5 minutes). Secret until used; never log it.
    Avatar:
      type: string
      pattern: "^[a-z0-9-]{1,32}$"
      description: The id of one of the app's built-in avatars (for example `robot-7`). No photos.
      examples: [robot-7]
    Grade:
      type: [integer, "null"]
      minimum: -1
      maximum: 12
      description: "-1 kindergarten, 0 preparatory class, 1-12 school grade, null not set."
    Kid:
      type: object
      required: [id, nickname, avatar, grade, createdAt]
      properties:
        id: { type: string, format: uuid, description: Also the kid's account id. }
        nickname: { type: string }
        avatar: { $ref: "#/components/schemas/Avatar" }
        grade: { $ref: "#/components/schemas/Grade" }
        createdAt: { type: string, format: date-time }
    Family:
      type: object
      required: [id, name, createdAt, parents, kids]
      properties:
        id: { type: string, format: uuid }
        name: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        parents:
          type: array
          description: In the order they joined.
          items:
            type: object
            required: [id, displayName]
            properties:
              id: { type: string, format: uuid }
              displayName: { type: [string, "null"] }
        kids:
          type: array
          description: In the order they were added.
          items: { $ref: "#/components/schemas/Kid" }

    MembershipEvent:
      description: |
        Not an HTTP body: the messages on the Cloudflare Queue `zapakid-membership-<environment>` (staging,
        production), produced by the account service (families, connections, devices) and consumed by the chat
        service. JSON, at most 128 KiB. Delivery is at least once and not ordered across batches: `id` makes a
        repeat a no-op, and each event carries the full state of what it describes (for example the device's
        current registration id), so applying events again is safe. The account service must send an event after
        its own write commits. Unknown `type`s are acknowledged and ignored (forward compatible); a malformed
        event goes to the dead-letter queue `zapakid-membership-<environment>-dlq` after 5 retries.
      type: object
      required: [v, id, type, occurredAt]
      properties:
        v: { type: integer, const: 1 }
        id: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        type:
          type: string
          enum:
            - family.member_added
            - family.member_removed
            - connection.created
            - connection.removed
            - connection.kid_shared
            - connection.kid_unshared
            - device.upserted
            - device.removed
            - account.deleted
      oneOf:
        - title: family.member_added
          description: A parent or kid joined a family (new family, parent invitation accepted, kid added).
          required: [type, familyId, accountId, role]
          properties:
            type: { const: family.member_added }
            familyId: { type: string, maxLength: 64 }
            accountId: { $ref: "#/components/schemas/AccountId" }
            role: { $ref: "#/components/schemas/Role" }
        - title: family.member_removed
          required: [type, familyId, accountId]
          properties:
            type: { const: family.member_removed }
            familyId: { type: string, maxLength: 64 }
            accountId: { $ref: "#/components/schemas/AccountId" }
        - title: connection.created
          required: [type, connectionId, familyIds]
          properties:
            type: { const: connection.created }
            connectionId: { type: string, maxLength: 64 }
            familyIds: { type: array, minItems: 2, maxItems: 2, items: { type: string, maxLength: 64 } }
        - title: connection.removed
          required: [type, connectionId]
          properties:
            type: { const: connection.removed }
            connectionId: { type: string, maxLength: 64 }
        - title: connection.kid_shared
          description: The kid's family shares the kid with the other family of the connection.
          required: [type, connectionId, kidAccountId]
          properties:
            type: { const: connection.kid_shared }
            connectionId: { type: string, maxLength: 64 }
            kidAccountId: { $ref: "#/components/schemas/AccountId" }
        - title: connection.kid_unshared
          required: [type, connectionId, kidAccountId]
          properties:
            type: { const: connection.kid_unshared }
            connectionId: { type: string, maxLength: 64 }
            kidAccountId: { $ref: "#/components/schemas/AccountId" }
        - title: device.upserted
          description: A device was registered, re-installed (new registration id) or got a new push token.
          required: [type, accountId, deviceId, registrationId]
          properties:
            type: { const: device.upserted }
            accountId: { $ref: "#/components/schemas/AccountId" }
            deviceId: { $ref: "#/components/schemas/DeviceId" }
            registrationId: { type: integer, minimum: 1, maximum: 16383 }
            push:
              type: [object, "null"]
              description: Where to send content-free wake-ups; `null` = none.
              required: [provider, token]
              properties:
                provider: { type: string, enum: [apns, fcm] }
                token: { type: string, maxLength: 4096 }
        - title: device.removed
          required: [type, accountId, deviceId]
          properties:
            type: { const: device.removed }
            accountId: { $ref: "#/components/schemas/AccountId" }
            deviceId: { $ref: "#/components/schemas/DeviceId" }
        - title: account.deleted
          description: Immediate account deletion (also sent for each kid when the last parent of a family leaves).
          required: [type, accountId]
          properties:
            type: { const: account.deleted }
            accountId: { $ref: "#/components/schemas/AccountId" }

    AccountId:
      type: string
      pattern: "^[A-Za-z0-9_-]{1,64}$"
      description: The account id from the account service (the chat token's `sub`).
    Role:
      type: string
      enum: [parent, kid]

    Base64:
      type: string
      contentEncoding: base64
    DeviceId:
      type: integer
      minimum: 1
      maximum: 127
      description: The libsignal device id (the chat token's `dev`).
    PublicKey:
      description: A libsignal public key, serialized (type byte + key), base64.
      allOf: [{ $ref: "#/components/schemas/Base64" }]
    PreKey:
      type: object
      required: [keyId, publicKey]
      properties:
        keyId: { type: integer, minimum: 0, maximum: 16777215 }
        publicKey: { $ref: "#/components/schemas/PublicKey" }
    SignedPreKey:
      type: object
      description: An EC signed prekey or a Kyber prekey, with the identity key's signature over the public key.
      required: [keyId, publicKey, signature]
      properties:
        keyId: { type: integer, minimum: 0, maximum: 16777215 }
        publicKey: { $ref: "#/components/schemas/PublicKey" }
        signature: { $ref: "#/components/schemas/Base64" }
    DeviceKeys:
      type: object
      required: [registrationId, identityKey, signedPreKey, pqLastResortPreKey, preKeys, pqPreKeys]
      properties:
        registrationId: { type: integer, minimum: 1, maximum: 16383 }
        identityKey:
          allOf: [{ $ref: "#/components/schemas/PublicKey" }]
          description: Must match the account's current identity key; changing it is `PUT /v1/keys/identity`.
        signedPreKey: { $ref: "#/components/schemas/SignedPreKey" }
        pqLastResortPreKey: { $ref: "#/components/schemas/SignedPreKey" }
        preKeys: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/PreKey" } }
        pqPreKeys: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/SignedPreKey" } }
        pushToken: { type: string, maxLength: 4096, description: APNs or FCM token (no message content in pushes). }
    PreKeyBundle:
      type: object
      required: [deviceId, registrationId, signedPreKey, pqPreKey]
      properties:
        deviceId: { $ref: "#/components/schemas/DeviceId" }
        registrationId: { type: integer }
        signedPreKey: { $ref: "#/components/schemas/SignedPreKey" }
        pqPreKey: { $ref: "#/components/schemas/SignedPreKey" }
        preKey: { $ref: "#/components/schemas/PreKey" }
    OutgoingEnvelope:
      type: object
      required: [recipientAccountId, recipientDeviceId, recipientRegistrationId, type, content]
      properties:
        recipientAccountId: { type: string }
        recipientDeviceId: { $ref: "#/components/schemas/DeviceId" }
        recipientRegistrationId: { type: integer }
        type:
          type: string
          enum: [prekey_message, message, sender_key_message]
          description: The libsignal ciphertext type. There is no plaintext type.
        content:
          allOf: [{ $ref: "#/components/schemas/Base64" }]
          description: libsignal ciphertext, at most 64 KiB.

# Creates the secrets the Workers generate for themselves, for one environment, so nobody handles them by hand:
#   account Worker: CHAT_TOKEN_SIGNING_KEY (a new ES256 key pair)
#   calls Worker:   REALTIME_APP_ID + REALTIME_APP_SECRET (a new Realtime SFU app "zapakid-<env>") and
#                   TURN_KEY_ID + TURN_KEY_API_TOKEN (a new TURN key "zapakid-<env>")
# Manual only (Actions → bootstrap-secrets → Run workflow); the `staging` and `production` environments need
# @stefan-zpc's approval. Idempotent: what is already set is skipped unless `rotate` names it. A Worker that isn't
# deployed yet is skipped with a notice: deploy it, then run this again.
# Values are masked as soon as they exist and go to `wrangler secret put` on stdin (scripts/bootstrap-secrets.js);
# nothing is echoed, uploaded or cached. The environment's CLOUDFLARE_API_TOKEN needs Calls: Write (README).
name: bootstrap-secrets

on:
  workflow_dispatch:
    inputs:
      env:
        description: Environment
        required: true
        type: choice
        options: [staging, production]
      rotate:
        description: Replace secrets that are already set (none = only create missing ones)
        required: true
        type: choice
        default: none
        options: [none, chat-token-key, realtime, all]

permissions:
  contents: read

concurrency:
  group: bootstrap-secrets-${{ inputs.env }}
  cancel-in-progress: false

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.env }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts

      - name: Create and store the secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ENVIRONMENT: ${{ inputs.env }}
          ROTATE: ${{ inputs.rotate }}
        run: node scripts/bootstrap-secrets.js "$ENVIRONMENT"

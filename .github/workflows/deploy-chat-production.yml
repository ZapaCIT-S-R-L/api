# Deploys a released chat version (a chat-vX.Y.Z tag that already passed staging) to production (chat.zapakid.ro).
# Manual only (Actions → deploy-chat-production → Run workflow); the `production` environment requires approval by
# @stefan-zpc. Credentials live only in that environment: secret CLOUDFLARE_API_TOKEN, variable CLOUDFLARE_ACCOUNT_ID.
name: deploy-chat-production

on:
  workflow_dispatch:
    inputs:
      version:
        description: Chat release tag to deploy (chat-vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-chat-production
  cancel-in-progress: false

defaults:
  run:
    working-directory: services/chat

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://chat.zapakid.ro/health
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check the version is a chat release tag
        working-directory: .
        run: |
          if ! [[ "$VERSION" =~ ^chat-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::Not a chat release tag: $VERSION"; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.version }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx wrangler deploy --dry-run --env production --outdir dist

      - name: Resources (EU) and D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/resources.js production
          npx wrangler d1 migrations apply DB --env production --remote

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERSION_URL: https://github.com/${{ github.repository }}/tree/${{ inputs.version }}/services/chat
        run: >-
          npx wrangler deploy --env production --tag "$VERSION" --message "deploy $VERSION"
          --var "VERSION:$VERSION" --var "VERSION_URL:$VERSION_URL"

      - name: End-to-end tests against production
        id: e2e
        env:
          CHAT_URL: https://chat.zapakid.ro
          LIVE: "1"
        run: |
          node ../../scripts/wait-for-version.js "$CHAT_URL" "$VERSION"
          npm run test:e2e || { sleep 30; npm run test:e2e; }

      - name: Roll back to the previous version
        if: failure() && steps.e2e.conclusion == 'failure'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if out=$(npx wrangler rollback --env production --yes --message "e2e failed after deploy of $VERSION" 2>&1); then
            echo "$out"
            echo "::error::e2e failed after deploying $VERSION; rolled back to the previous version." | tee -a "$GITHUB_STEP_SUMMARY"
          elif grep -q "Could not find stable Worker Version" <<<"$out"; then
            echo "$out"
            echo "::error::e2e failed after deploying $VERSION, the first version of the chat Worker: nothing to roll back to. Fix forward." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "$out"
            echo "::error::e2e failed after deploying $VERSION, and the rollback failed too: check the chat Worker now." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          exit 1
